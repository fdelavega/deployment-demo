services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: example-app-step01-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngb -d ngb"]
      interval: 10s
      timeout: 5s
      retries: 10

  scorpio:
    image: scorpiobroker/all-in-one-runner:java-4.1.10
    container_name: example-app-step01-scorpio
    restart: unless-stopped
    environment:
      DBHOST: postgres
      DBUSER: ngb
      DBPASS: ngb
      DBNAME: ngb
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:9090"

volumes:
  postgres-data:
